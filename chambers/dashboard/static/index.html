<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#030609">
<title>Trading Chambers</title>
<style>
:root {
  --bg:#030609; --surface:#080d14; --card:#0c1420; --border:#14243a;
  --text:#d4e8ff; --muted:#5a7090; --dim:#3a5070; --green:#00e676; --teal:#1de9b6;
  --blue:#40c4ff; --yellow:#ffd740; --red:#ff3d57; --purple:#b388ff; --orange:#ffab40;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { background:var(--bg); color:var(--text); font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size:13px; }
body { padding: env(safe-area-inset-top, 0) 0 32px 0; }
main { max-width: 720px; margin: 0 auto; padding: 0 12px; }
h1 { font-size:15px; letter-spacing:.14em; color:var(--teal); padding:14px 0 8px; text-transform:uppercase; }
h2 { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:16px 0 6px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
.row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; }
.stat { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px; }
.stat .k { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
.stat .v { font-size:16px; font-weight:700; margin-top:2px; word-break:break-all; }
.badge { display:inline-block; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; border:1px solid var(--border); background:var(--surface); }
.dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:-1px; }
.ok { color:var(--green); } .bad { color:var(--red); } .warn { color:var(--yellow); } .off { color:var(--dim); }
.bg-ok { background:var(--green); } .bg-bad { background:var(--red); } .bg-off { background:var(--dim); }
.pos { color:var(--green); } .neg { color:var(--red); }
table { width:100%; border-collapse:collapse; }
th, td { text-align:left; padding:6px 4px; border-bottom:1px solid var(--border); font-size:12px; white-space:nowrap; }
th { color:var(--muted); font-weight:400; font-size:10px; text-transform:uppercase; letter-spacing:.08em; }
td.num, th.num { text-align:right; }
tr.tap { cursor:pointer; }
tr.detail td { white-space:normal; color:var(--muted); font-size:11px; background:var(--surface); }
.tablewrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
button { font:inherit; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; font-size:11px; cursor:pointer; }
button:active { transform:translateY(1px); }
button.primary { border-color:var(--teal); color:var(--teal); }
button.danger { border-color:var(--red); color:var(--red); }
button.armed { background:var(--red); color:#fff; }
button:disabled { opacity:.4; cursor:default; }
.controls { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.form { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.field label { display:block; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-bottom:3px; }
.field input[type=number], .field input[type=text], .field input[type=password] { width:100%; font:inherit; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:8px; }
.field input[type=checkbox] { width:18px; height:18px; }
.muted { color:var(--muted); } .small { font-size:11px; }
.msg { font-size:11px; color:var(--yellow); min-height:14px; margin-top:6px; }
.empty { color:var(--dim); padding:8px 0; font-size:12px; }
#login { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:10; padding:16px; }
#login .card { width:100%; max-width:360px; }
#login h1 { padding-top:0; }
.err { border-left:3px solid var(--red); padding:6px 8px; margin-bottom:6px; background:var(--surface); border-radius:4px; }
.err .w { color:var(--red); font-weight:700; }
.err .m { white-space:pre-wrap; word-break:break-word; color:var(--muted); font-size:11px; }
.sweep { border-bottom:1px solid var(--border); padding:6px 0; font-size:11px; }
.sweep:last-child { border-bottom:none; }
.sweep .d { font-weight:700; color:var(--text); }
.sweep .delta { color:var(--yellow); }
.sweep .same { color:var(--dim); }
.foot { color:var(--dim); font-size:10px; text-align:center; margin-top:18px; }
.tabs { display:flex; gap:6px; overflow-x:auto; padding:2px 0 8px; -webkit-overflow-scrolling:touch; position:sticky; top:0; background:var(--bg); z-index:5; }
.tabs button { padding:8px 10px; flex:0 0 auto; }
.tabs button.on { border-color:var(--teal); color:var(--bg); background:var(--teal); }
.sl { border-bottom:1px solid var(--border); padding:7px 0; font-size:12px; }
.sl:last-child { border-bottom:none; }
.sl .t { display:flex; justify-content:space-between; gap:6px; }
.sl .n { font-weight:700; }
.sl .s { color:var(--muted); font-size:11px; margin-top:2px; }
.bar { height:6px; background:var(--surface); border:1px solid var(--border); border-radius:4px; overflow:hidden; margin-top:4px; }
.bar > i { display:block; height:100%; background:var(--green); }
.bar > i.bad { background:var(--red); }
.sug { border-left:3px solid var(--purple); padding:6px 8px; margin-bottom:6px; background:var(--surface); border-radius:4px; font-size:11px; }
.sug .h { font-weight:700; color:var(--purple); }
.sug .b { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:6px; }
.al { font-size:11px; border-bottom:1px solid var(--border); padding:5px 0; word-break:break-word; }
.al:last-child { border-bottom:none; }
.hidden { display:none !important; }
@media (min-width: 520px) { .grid { grid-template-columns: repeat(4, 1fr); } .form { grid-template-columns: repeat(4, 1fr); } }
</style>
</head>
<body>
<div id="login">
  <div class="card">
    <h1>Trading Chambers</h1>
    <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" autofocus></div>
    <div style="height:8px"></div>
    <button class="primary" id="loginBtn" style="width:100%">Enter</button>
    <div class="msg" id="loginMsg"></div>
  </div>
</div>

<main id="app" style="display:none">
  <h1>Trading Chambers <span class="muted small">phase 1A</span></h1>

  <!-- sleeve selector -->
  <nav class="tabs" id="tabs"></nav>

  <!-- 1. Heartbeat bar -->
  <section class="card" id="heartbeat">
    <div class="row">
      <span class="badge" id="stateBadge">—</span>
      <span id="cycleAge" class="off"><span class="dot bg-off"></span>no cycle yet</span>
    </div>
    <div class="row small muted" style="margin-top:8px">
      <span id="marketStatus">market —</span>
      <span id="nextOpen"></span>
    </div>
    <div class="row small muted" style="margin-top:4px">
      <span id="pidInfo"></span>
      <span id="lastErr" class="bad"></span>
    </div>
  </section>

  <!-- sleeves overview + portfolio (always) -->
  <h2>Sleeves</h2>
  <section class="card" id="sleeves"></section>

  <h2>Portfolio</h2>
  <section class="card" id="portfolio"></section>

  <!-- 2. Today -->
  <h2 class="persleeve">Today <span id="todayMeta" class="muted" style="text-transform:none;letter-spacing:0"></span></h2>
  <section class="grid persleeve" id="today"></section>

  <!-- $100 profile (P100 view) -->
  <h2 class="p100only">$100 cash-account profile (replay only)</h2>
  <section class="card p100only" id="p100"></section>

  <!-- 3. Controls -->
  <h2>Controls</h2>
  <section class="card">
    <div class="controls">
      <button id="pauseBtn" class="primary">Pause entries</button>
      <button id="flattenBtn" class="danger">Flatten now</button>
    </div>
    <div class="msg" id="ctlMsg"></div>
  </section>

  <!-- 4. Open positions -->
  <h2 class="persleeve">Open positions</h2>
  <section class="card tablewrap persleeve" id="positions"></section>

  <!-- 5. Recent trades -->
  <h2 class="persleeve">Recent trades</h2>
  <section class="card tablewrap persleeve" id="trades"></section>

  <!-- 6. Params -->
  <h2 class="paramsec">Params <span id="paramsMeta" class="muted" style="text-transform:none;letter-spacing:0"></span></h2>
  <section class="card paramsec">
    <div class="form" id="paramsForm"></div>
    <div style="height:8px"></div>
    <button class="primary" id="saveBtn" style="width:100%">Save (applies next cycle)</button>
    <div class="msg" id="paramsMsg"></div>
  </section>

  <!-- 7. Sweep history -->
  <h2 class="paramsec">Sweep history</h2>
  <section class="card paramsec" id="sweeps"></section>

  <!-- night lab -->
  <h2>Night lab <span class="muted" style="text-transform:none;letter-spacing:0">suggest only — never trades</span></h2>
  <section class="card" id="lab"></section>

  <!-- alerts -->
  <h2>Alerts</h2>
  <section class="card" id="alerts"></section>

  <!-- 8. Errors -->
  <h2>Errors</h2>
  <section class="card" id="errors"></section>

  <div class="foot" id="foot"></div>
</main>

<script>
(function () {
  'use strict';
  var token = null;              // kept in memory only
  var state = null;
  var pollTimer = null;
  var flattenArmed = false, flattenTimer = null;
  var openDetail = null;         // trade id whose detail row is expanded
  var paramsDirty = false, paramsFor = null;
  var VIEWS = ['All', 'S0', 'S1', 'S2', 'S3', 'P100'];
  var view = 'All';
  try { var saved = localStorage.getItem('tc_view'); if (VIEWS.indexOf(saved) >= 0) view = saved; } catch (e) {}

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function num(v, d) { if (v == null || isNaN(v)) return '—'; return Number(v).toFixed(d == null ? 2 : d); }
  function money(v) { if (v == null || isNaN(v)) return '—'; var n = Number(v); return (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}); }
  function pnlCls(v) { return v == null ? '' : (v >= 0 ? 'pos' : 'neg'); }
  function hhmm(iso) { if (!iso) return '—'; var m = /T(\d\d:\d\d:\d\d)/.exec(iso); return m ? m[1] : iso; }
  function ago(iso, now) { if (!iso) return null; return Math.max(0, Math.round((new Date(now) - new Date(iso)) / 1000)); }
  function fmtDur(s) { if (s == null) return '—'; if (s < 60) return s + 's'; if (s < 3600) return Math.floor(s / 60) + 'm ' + (s % 60) + 's'; var h = Math.floor(s / 3600); var m = Math.floor((s % 3600) / 60); if (h < 48) return h + 'h ' + m + 'm'; return Math.floor(h / 24) + 'd ' + (h % 24) + 'h'; }
  function qty(q) { return (q != null && Number(q) % 1 !== 0) ? num(q, 6) : esc(q); }
  function show(cls, on) { Array.prototype.forEach.call(document.querySelectorAll('.' + cls), function (e) { e.classList.toggle('hidden', !on); }); }
  // how late a sleeve's last cycle may be before it counts as stale (its own cadence + 90 s)
  var CADENCE = {S0: 60, S1: 900, S2: 3600, S3: 9000, ALL: 60};

  function api(method, path, body) {
    var opts = { method: method, headers: {} };
    if (token) opts.headers['Authorization'] = 'Bearer ' + token;
    if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    return fetch(path, opts).then(function (r) {
      if (r.status === 401 && path !== '/api/login') { logout('session expired — log in again'); throw new Error('unauthorized'); }
      return r.json().then(function (j) { if (!r.ok) throw new Error(j.detail || r.statusText); return j; });
    });
  }

  function logout(msg) {
    token = null; state = null;
    if (pollTimer) clearInterval(pollTimer);
    $('app').style.display = 'none'; $('login').style.display = 'flex';
    $('loginMsg').textContent = msg || '';
  }

  function login() {
    $('loginMsg').textContent = '';
    api('POST', '/api/login', { password: $('pw').value }).then(function (j) {
      token = j.token; $('pw').value = '';
      $('login').style.display = 'none'; $('app').style.display = 'block';
      refresh(); pollTimer = setInterval(refresh, 5000);
    }).catch(function (e) { $('loginMsg').textContent = e.message; });
  }
  $('loginBtn').addEventListener('click', login);
  $('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });

  function refresh() {
    var v = view;
    api('GET', '/api/state?sleeve=' + encodeURIComponent(v)).then(function (s) { if (v === view) { state = s; render(); } }).catch(function (e) {
      $('foot').textContent = 'refresh failed: ' + e.message;
    });
  }

  function setView(v) {
    view = v; openDetail = null; paramsDirty = false;
    try { localStorage.setItem('tc_view', v); } catch (e) {}
    renderTabs(); refresh();
  }

  // ---------- render ----------
  function render() {
    var s = state; if (!s) return;
    var single = ['S0', 'S1', 'S2', 'S3'].indexOf(view) >= 0;
    show('persleeve', view !== 'P100'); show('paramsec', single); show('p100only', view === 'P100');
    renderTabs(); renderHeartbeat(s); renderSleeves(s); renderPortfolio(s); renderToday(s); renderControls(s);
    renderPositions(s); renderTrades(s); if (single) { renderParams(s); renderSweeps(s); }
    if (view === 'P100') renderP100(s);
    renderLab(s); renderAlerts(s); renderErrors(s);
    $('foot').textContent = 'updated ' + hhmm(s.now) + ' ET · ' + view + ' · polling every 5s';
  }

  function renderTabs() {
    $('tabs').innerHTML = VIEWS.map(function (v) { return '<button data-v="' + v + '" class="' + (v === view ? 'on' : '') + '">' + v + '</button>'; }).join('');
    Array.prototype.forEach.call($('tabs').querySelectorAll('button'), function (b) { b.addEventListener('click', function () { setView(b.getAttribute('data-v')); }); });
  }

  function cycleDot(sid, iso, now, isOpen) {
    var age = ago(iso, now);
    if (age == null) return ['off', 'bg-off', 'no cycle yet'];
    var limit = (CADENCE[sid] || 60) + 90;
    var active = sid === 'S2' || isOpen === true;
    var txt = 'last cycle ' + fmtDur(age) + ' ago';
    if (!active) return ['off', 'bg-off', txt];
    return age < limit ? ['ok', 'bg-ok', txt] : ['bad', 'bg-bad', txt];
  }

  function renderHeartbeat(s) {
    var hb = s.heartbeat || {}, mk = s.market || {};
    var st = hb.state || (view === 'P100' ? 'replay' : 'unknown');
    var badge = $('stateBadge'); badge.textContent = (view === 'All' ? 'all · ' : view + ' · ') + st;
    badge.className = 'badge ' + ({running:'ok', flattening:'warn', sweeping:'warn', preopen:'warn', postclose:'off', idle:'off'}[st] || 'off');
    var c = cycleDot(view === 'All' ? 'ALL' : view, hb.last_cycle_ts, s.now, mk.is_open);
    var el = $('cycleAge'); el.className = c[0]; el.innerHTML = '<span class="dot ' + c[1] + '"></span>' + esc(view === 'P100' ? 'nightly replay' : c[2]);
    var ms = $('marketStatus');
    if (mk.is_open === true) ms.innerHTML = '<span class="ok">market open</span>' + (mk.entries_allowed ? ' · entries allowed' : ' · entries closed') + (mk.flatten_at ? ' · flatten ' + hhmm(mk.flatten_at) : '');
    else if (mk.is_open === false) ms.innerHTML = '<span class="off">market closed</span>';
    else ms.innerHTML = '<span class="off">market status unavailable (no broker)</span>';
    var no = $('nextOpen');
    if (mk.is_open === false && mk.next_open) { var secs = Math.max(0, Math.round((new Date(mk.next_open) - new Date(s.now)) / 1000)); no.textContent = 'opens in ' + fmtDur(secs); }
    else if (mk.is_open === true && mk.session_close) no.textContent = 'closes ' + hhmm(mk.session_close);
    else no.textContent = '';
    $('pidInfo').textContent = hb.pid ? ('pid ' + hb.pid + (hb.started_at ? ' · up since ' + hhmm(hb.started_at) : '')) : '';
    $('lastErr').textContent = hb.last_error ? ('last error ' + hhmm(hb.last_error_ts) + ': ' + hb.last_error.slice(0, 80)) : '';
  }

  function renderSleeves(s) {
    var sl = s.sleeves || [], mk = s.market || {};
    if (!sl.length) { $('sleeves').innerHTML = '<div class="empty">no sleeves registered yet</div>'; return; }
    $('sleeves').innerHTML = sl.map(function (x) {
      var c = cycleDot(x.id, x.last_cycle_ts, s.now, mk.is_open);
      return '<div class="sl"><div class="t"><span><span class="dot ' + c[1] + '"></span><span class="n">' + esc(x.id) + '</span> ' + esc(x.name) +
        (x.active ? '' : ' <span class="off">(inactive)</span>') + '</span><span class="' + pnlCls(x.net_pnl_today) + '">' + money(x.net_pnl_today) + '</span></div>' +
        '<div class="s">' + esc(x.state || '—') + ' · ' + esc(c[2]) + ' · ' + esc(x.closed_today == null ? 0 : x.closed_today) + ' closed · ' + esc(x.open_positions) + ' open</div>' +
        '<div class="s">edge vs twin today <span class="' + pnlCls(x.edge_today) + '">' + money(x.edge_today) + '</span> · ' + esc(x.trailing_sessions) + 's <span class="' + pnlCls(x.edge_trailing) + '">' + money(x.edge_trailing) + '</span>' +
        ' · capital ' + money(x.equity) + '</div></div>';
    }).join('');
  }

  function renderPortfolio(s) {
    var p = s.portfolio || {};
    var used = (p.daily_pnl != null && p.loss_limit) ? Math.min(100, Math.max(0, p.daily_pnl / p.loss_limit * 100)) : 0;
    var r = p.last_recon;
    $('portfolio').innerHTML =
      '<div class="row"><span>equity</span><b>' + money(p.equity) + '</b></div>' +
      '<div class="row small" style="margin-top:6px"><span>day P&amp;L vs loss limit</span><span class="' + pnlCls(p.daily_pnl) + '">' + money(p.daily_pnl) + ' / ' + money(p.loss_limit) + '</span></div>' +
      '<div class="bar"><i class="' + (p.halted || used > 75 ? 'bad' : '') + '" style="width:' + (p.daily_pnl < 0 ? used : 0) + '%"></i></div>' +
      (p.halted ? '<div class="small bad" style="margin-top:4px">DAILY LOSS HALT since ' + hhmm(p.halted_ts) + ' — equity-sleeve entries stopped</div>' : '') +
      '<div class="row small" style="margin-top:6px"><span>gross exposure</span><span>' + money(p.exposure) + (p.exposure_pct != null ? ' (' + num(p.exposure_pct, 0) + '% of equity)' : '') + '</span></div>' +
      '<div class="row small"><span>same side</span><span>' + esc(p.long) + ' long · ' + esc(p.short) + ' short (max ' + esc(p.max_same_side) + ')</span></div>' +
      '<div class="row small"><span>last recon</span><span class="' + (r ? (r.status === 'pass' ? 'ok' : r.status === 'mismatch' || r.status === 'error' ? 'bad' : 'off') : 'off') + '">' +
      (r ? esc(r.status) + ' ' + esc((r.ts || '').slice(5, 16).replace('T', ' ')) + (r.diff != null ? ' · diff ' + money(r.diff) : '') : 'none yet') + '</span></div>';
  }

  function renderToday(s) {
    if (view === 'P100') return;
    var hb = s.heartbeat || {}, ac = s.account || {}, e = s.edge;
    if (view === 'All') {   // the overall row carries no counters: sum the sleeves
      hb = {}; ['cycles_today', 'signals_today', 'fired_today', 'opened_today', 'closed_today'].forEach(function (k) { hb[k] = 0; });
      (s.sleeves || []).forEach(function (x) { ['cycles_today', 'opened_today', 'closed_today'].forEach(function (k) { hb[k] += x[k] || 0; }); });
      hb.signals_today = hb.fired_today = null;
      hb.open_positions = (s.sleeves || []).reduce(function (a, x) { return a + (x.open_positions || 0); }, 0);
      hb.net_pnl_today = (s.sleeves || []).reduce(function (a, x) { return a + (x.net_pnl_today || 0); }, 0);
    }
    var items = [
      ['cycles', hb.cycles_today], ['signals', hb.signals_today], ['fired', hb.fired_today],
      ['opened', hb.opened_today], ['closed', hb.closed_today], ['open pos', hb.open_positions],
      ['net pnl today', money(hb.net_pnl_today), pnlCls(hb.net_pnl_today)],
      ['portfolio', money(ac.portfolio_value)], ['buying power', money(ac.buying_power)]
    ];
    if (e) items.splice(7, 0, ['edge vs twin', money(e.edge), pnlCls(e.edge)], ['edge ' + e.sessions + ' sess', money(e.edge_trailing), pnlCls(e.edge_trailing)],
                        ['twin net today', money(e.twin_net), pnlCls(e.twin_net)]);
    $('todayMeta').textContent = view === 'All' ? '· all sleeves' : '· ' + view;
    $('today').innerHTML = items.map(function (it) {
      return '<div class="stat"><div class="k">' + esc(it[0]) + '</div><div class="v ' + (it[2] || '') + '">' + esc(it[1] == null ? '—' : it[1]) + '</div></div>';
    }).join('');
  }

  function renderControls(s) {
    var c = s.controls || {};
    var pb = $('pauseBtn');
    pb.textContent = c.paused ? 'Resume entries' : 'Pause entries';
    pb.className = c.paused ? 'danger' : 'primary';
    if (!flattenArmed) { var fb = $('flattenBtn'); fb.textContent = c.flatten_requested ? 'Flatten pending…' : 'Flatten now (all sleeves)'; fb.className = 'danger'; }
    if (c.paused && !$('ctlMsg').textContent) $('ctlMsg').textContent = 'entries paused in every sleeve — exits keep running';
    else if (!c.paused && $('ctlMsg').textContent === 'entries paused in every sleeve — exits keep running') $('ctlMsg').textContent = '';
  }
  $('pauseBtn').addEventListener('click', function () {
    var paused = !(state && state.controls && state.controls.paused);
    api('POST', '/api/pause', { paused: paused }).then(function () { $('ctlMsg').textContent = paused ? 'entries paused in every sleeve — exits keep running' : 'entries resumed'; refresh(); })
      .catch(function (e) { $('ctlMsg').textContent = e.message; });
  });
  $('flattenBtn').addEventListener('click', function () {
    var fb = $('flattenBtn');
    if (!flattenArmed) {
      flattenArmed = true; fb.textContent = 'Tap again to confirm'; fb.className = 'danger armed';
      flattenTimer = setTimeout(function () { flattenArmed = false; fb.className = 'danger'; renderControls(state || {}); }, 4000);
      return;
    }
    clearTimeout(flattenTimer); flattenArmed = false; fb.className = 'danger';
    api('POST', '/api/flatten').then(function () { $('ctlMsg').textContent = 'flatten requested — every sleeve, within 30 s'; refresh(); })
      .catch(function (e) { $('ctlMsg').textContent = e.message; });
  });

  function renderPositions(s) {
    var ps = s.open_positions || [];
    if (!ps.length) { $('positions').innerHTML = '<div class="empty">no open positions</div>'; return; }
    var all = view === 'All';
    var h = '<table><tr>' + (all ? '<th>sl</th>' : '') + '<th>sym</th><th>side</th><th class="num">qty</th><th class="num">entry</th><th class="num">now</th><th class="num">unreal</th><th class="num">bars</th><th class="num">to vwap</th><th class="num">to stop</th></tr>';
    ps.forEach(function (p) {
      h += '<tr>' + (all ? '<td class="muted">' + esc(p.sleeve_id) + '</td>' : '') + '<td><b>' + esc(p.symbol) + '</b></td><td class="' + (p.side === 'long' ? 'ok' : 'warn') + '">' + esc(p.side) + '</td>' +
        '<td class="num">' + qty(p.qty) + '</td><td class="num">' + num(p.entry_price, 2) + '</td><td class="num">' + num(p.current_price, 2) + '</td>' +
        '<td class="num ' + pnlCls(p.unrealized_pl) + '">' + money(p.unrealized_pl) + '</td>' +
        '<td class="num">' + esc(p.bars_held) + (p.bars_left != null ? '/' + esc(p.bars_held + p.bars_left) : '') + '</td>' +
        '<td class="num">' + (p.to_vwap_pct == null ? '—' : num(p.to_vwap_pct, 2) + '%') + '</td>' +
        '<td class="num ' + (p.to_stop_pct != null && p.to_stop_pct < 0.15 ? 'bad' : '') + '">' + (p.to_stop_pct == null ? '—' : num(p.to_stop_pct, 2) + '%') + '</td></tr>';
    });
    $('positions').innerHTML = h + '</table>';
  }

  function hypText(hy) {
    if (!hy) return '—';
    if (hy.dev_pct !== undefined) return 'dev ' + num(hy.dev_pct, 3) + '% · vol ratio ' + num(hy.vol_ratio, 2) + ' · expect ' + esc(hy.expect) + ' ' + num(hy.expect_move_pct, 3) + '% within ' + esc(hy.expect_within_bars) + ' bars';
    return Object.keys(hy).map(function (k) { return esc(k) + ' ' + esc(typeof hy[k] === 'number' ? Math.round(hy[k] * 10000) / 10000 : hy[k]); }).join(' · ');
  }

  function renderTrades(s) {
    var ts = s.recent_trades || [];
    if (!ts.length) { $('trades').innerHTML = '<div class="empty">' + (view === 'P100' ? 'see the $100 profile above' : 'no closed trades yet') + '</div>'; return; }
    var all = view === 'All';
    var h = '<table><tr><th>time</th>' + (all ? '<th>sl</th>' : '') + '<th>sym</th><th>side</th><th class="num">net</th><th>exit</th><th class="num">bars</th></tr>';
    ts.forEach(function (t) {
      h += '<tr class="tap" data-id="' + t.id + '"><td>' + hhmm(t.exit_ts) + '</td>' + (all ? '<td class="muted">' + esc(t.sleeve_id) + '</td>' : '') + '<td><b>' + esc(t.symbol) + '</b></td><td class="' + (t.side === 'long' ? 'ok' : 'warn') + '">' + esc(t.side) + '</td>' +
        '<td class="num ' + pnlCls(t.net_pnl) + '">' + money(t.net_pnl) + '</td><td>' + esc(t.exit_reason) + '</td><td class="num">' + esc(t.bars_held) + '</td></tr>';
      if (openDetail === t.id) {
        h += '<tr class="detail"><td colspan="' + (all ? 7 : 6) + '">' +
          'entry ' + hhmm(t.entry_ts) + ' @ ' + num(t.entry_price, 4) + ' → exit @ ' + num(t.exit_price, 4) + ' · qty ' + qty(t.qty) +
          (t.news_day ? ' · <span class="warn">news day: ' + esc(t.event) + '</span>' : '') +
          '<br>hypothesis: ' + hypText(t.hypothesis) +
          '<br>MAE ' + num(t.mae_pct, 3) + '% · MFE ' + num(t.mfe_pct, 3) + '% · gross ' + money(t.gross_pnl) + ' · est cost ' + money(t.est_cost) +
          '<br>bid/ask in ' + num(t.entry_bid, 2) + '/' + num(t.entry_ask, 2) + ' · out ' + num(t.exit_bid, 2) + '/' + num(t.exit_ask, 2) +
          '</td></tr>';
      }
    });
    $('trades').innerHTML = h + '</table>';
    Array.prototype.forEach.call($('trades').querySelectorAll('tr.tap'), function (tr) {
      tr.addEventListener('click', function () { var id = Number(tr.getAttribute('data-id')); openDetail = openDetail === id ? null : id; renderTrades(state); });
    });
  }

  function renderParams(s) {
    var pr = s.params; if (!pr) return;
    var p = pr.params || {}, fields = pr.fields || [];
    $('paramsMeta').textContent = '· ' + pr.sleeve_id + ' · ' + (pr.source || '—') + (pr.updated_at ? ' · ' + pr.updated_at.slice(0, 16).replace('T', ' ') : '');
    var form = $('paramsForm');
    if (paramsFor !== pr.sleeve_id) { paramsFor = pr.sleeve_id; paramsDirty = false; form.innerHTML = ''; }
    if (paramsDirty) return;  // don't clobber an edit in progress
    if (!form.children.length) {
      form.innerHTML = fields.map(function (f) {
        var inp = f.type === 'bool' ? '<input type="checkbox" id="p_' + f.key + '">' : '<input type="number" step="' + f.step + '" id="p_' + f.key + '" inputmode="decimal">';
        return '<div class="field"><label for="p_' + f.key + '">' + esc(f.key.replace(/_/g, ' ')) + '</label>' + inp + '</div>';
      }).join('');
      Array.prototype.forEach.call(form.querySelectorAll('input'), function (i) { i.addEventListener('input', function () { paramsDirty = true; }); });
    }
    fields.forEach(function (f) { var el = $('p_' + f.key); if (!el) return; if (f.type === 'bool') el.checked = !!p[f.key]; else el.value = p[f.key] == null ? '' : p[f.key]; });
  }
  $('saveBtn').addEventListener('click', function () {
    if (!state || !state.params) return;
    var body = {};
    (state.params.fields || []).forEach(function (f) { var el = $('p_' + f.key); body[f.key] = f.type === 'bool' ? el.checked : Number(el.value); });
    api('POST', '/api/params', { sleeve_id: state.params.sleeve_id, params: body }).then(function () { paramsDirty = false; $('paramsMsg').textContent = 'saved — applies on the next cycle'; refresh(); })
      .catch(function (e) { $('paramsMsg').textContent = e.message; });
  });

  function renderSweeps(s) {
    var hs = s.sweep_history || [];
    if (!hs.length) { $('sweeps').innerHTML = '<div class="empty">no sweep has run yet</div>'; return; }
    $('sweeps').innerHTML = hs.map(function (h) {
      var p = h.params || {};
      var d = Object.keys(h.delta || {});
      var deltaTxt = d.length ? d.map(function (k) { return k + ' ' + h.delta[k][0] + '→' + h.delta[k][1]; }).join(', ') : 'unchanged';
      return '<div class="sweep"><span class="d">' + esc(h.date) + '</span> · ' + Object.keys(p).map(function (k) { return esc(k) + ' ' + esc(p[k]); }).join(' · ') +
        '<br><span class="' + (d.length ? 'delta' : 'same') + '">' + esc(deltaTxt) + '</span>' +
        (h.replay_trades != null ? ' · replay ' + esc(h.replay_trades) + ' trades / ' + money(h.replay_net_pnl) : '') + (h.days ? ' over ' + h.days.length + 'd' : '') +
        (h.today_closed_trades != null ? ' · live closed today ' + esc(h.today_closed_trades) : '') +
        (h.evidence_trades != null ? ' · evidence ' + esc(h.evidence_trades) + ' trades' : '') +
        (h.reason && !h.changed ? '<br><span class="muted">' + esc(h.reason) + '</span>' : '') + '</div>';
    }).join('');
  }

  function renderP100(s) {
    var v = s.p100 || {}, led = v.ledger || [];
    if (!led.length) { $('p100').innerHTML = '<div class="empty">P100 has not run yet (it runs nightly after the sweeps)</div>'; return; }
    var L = led[0], first = led[led.length - 1];
    var h = '<div class="row"><span>equity ' + esc(L.date) + '</span><b>' + money(L.end_equity) + '</b></div>' +
      '<div class="row small"><span>day / ' + led.length + 'd</span><span><span class="' + pnlCls(L.net_pnl) + '">' + money(L.net_pnl) + '</span> / <span class="' + pnlCls(L.end_equity - first.start_equity) + '">' + money(L.end_equity - first.start_equity) + '</span></span></div>' +
      '<div class="row small"><span>settled cash</span><span>' + money(L.settled_cash_start) + ' → ' + money(L.settled_cash_end) + '</span></div>' +
      '<div class="row small"><span>unsettled (T+1)</span><span>' + (L.unsettled || []).map(function (u) { return money(u[0]) + ' on ' + esc(u[1]); }).join(', ') + '</span></div>' +
      '<div class="row small"><span>trades / skipped</span><span>' + esc(L.trades) + ' / ' + esc(L.skipped) + '</span></div>' +
      '<div class="row small"><span>shadow shorts (learning only)</span><span>' + esc(L.shadow_trades) + ' · ' + money(L.shadow_net) + '</span></div>';
    var ts = (v.trades || []).filter(function (t) { return !t.learning_only; });
    if (ts.length) {
      h += '<div class="tablewrap" style="margin-top:8px"><table><tr><th>time</th><th>src</th><th>sym</th><th class="num">qty</th><th class="num">net</th></tr>' +
        ts.map(function (t) { return '<tr><td>' + hhmm(t.entry_ts).slice(0, 5) + '-' + hhmm(t.exit_ts).slice(0, 5) + '</td><td class="muted">' + esc(t.source) + '</td><td><b>' + esc(t.symbol) + '</b>' + (t.symbol !== t.signal_symbol ? ' <span class="muted">(' + esc(t.signal_symbol) + ' short)</span>' : '') + '</td><td class="num">' + num(t.qty, 4) + '</td><td class="num ' + pnlCls(t.net_pnl) + '">' + money(t.net_pnl) + '</td></tr>'; }).join('') + '</table></div>';
    }
    var pp = v.params || {};
    h += '<div class="small muted" style="margin-top:8px">P100 params (own profile): ' + ['S0', 'S1'].map(function (k) {
      var x = (pp[k] || {}).params || {}; return k + ' ' + Object.keys(x).filter(function (q) { return ['entry_dev_pct', 'vol_mult', 'max_hold_bars', 'stop_pct', 'entry_z', 'stop_atr'].indexOf(q) >= 0; }).map(function (q) { return q + '=' + x[q]; }).join(' ');
    }).join(' · ') + '</div>';
    $('p100').innerHTML = h;
  }

  function renderLab(s) {
    var lab = s.lab || {}, run = lab.last_run, sug = lab.suggestions || [], res = lab.results || [];
    var h = '<div class="small muted">' + (run ? 'last run ' + esc((run.started_at || '').slice(0, 16).replace('T', ' ')) + ' · ' + esc(run.status) + (run.paused_s ? ' · paused ' + num(run.paused_s, 0) + 's' : '') : 'the lab has not run yet') + '</div>';
    var pend = sug.filter(function (x) { return x.status === 'pending'; });
    var minTr = lab.min_approve_trades || 0;
    h += pend.map(function (x) {
      var few = (x.grade_trades || 0) < minTr;
      return '<div class="sug"><div class="h">' + esc(x.candidate) + ' — suggested</div>' +
        '<div>graded net <span class="' + pnlCls(x.grade_net) + '">' + money(x.grade_net) + '</span> vs twin ' + money(x.twin_grade_net) + ' · ' + esc(x.grade_trades) + ' trades · ' + esc(x.n_sessions) + ' sessions</div>' +
        '<div class="muted">params ' + esc(JSON.stringify(x.params)) + '</div>' +
        (few ? '<div class="muted">approval needs ' + minTr + ' graded trades (has ' + esc(x.grade_trades || 0) + ')</div>' : '') +
        '<div class="b"><button class="primary" data-sug="' + x.id + '" data-st="approved"' + (few ? ' disabled title="needs ' + minTr + ' graded trades to approve"' : '') + '>Approve</button><button class="danger" data-sug="' + x.id + '" data-st="rejected">Reject</button></div></div>';
    }).join('');
    var decided = sug.filter(function (x) { return x.status === 'approved' || x.status === 'rejected'; }).slice(0, 5);
    if (decided.length) h += '<div class="small muted">' + decided.map(function (x) { return esc(x.candidate) + ' ' + esc(x.status) + ' ' + esc((x.decided_at || '').slice(0, 10)); }).join(' · ') + '</div>';
    if (res.length) h += '<div class="small" style="margin-top:6px">' + res.map(function (r) {
      return '<div class="al"><b>' + esc(r.candidate) + '</b> ' + (r.meets_rule ? '<span class="ok">meets rule</span>' : '<span class="off">no</span>') + ' · graded ' + money(r.grade_net) + ' vs twin ' + money(r.twin_grade_net) + '<br><span class="muted">' + esc(r.reason) + '</span></div>';
    }).join('') + '</div>';
    h += '<div class="msg" id="labMsg"></div>';
    $('lab').innerHTML = h;
    Array.prototype.forEach.call($('lab').querySelectorAll('button[data-sug]'), function (b) {
      b.addEventListener('click', function () {
        api('POST', '/api/lab/decide', { id: Number(b.getAttribute('data-sug')), status: b.getAttribute('data-st') })
          .then(function (j) { refresh(); }).catch(function (e) { $('labMsg').textContent = e.message; });
      });
    });
  }

  function renderAlerts(s) {
    var al = s.alerts || [];
    if (!al.length) { $('alerts').innerHTML = '<div class="empty">no alerts or messages yet</div>'; return; }
    $('alerts').innerHTML = al.map(function (a) {
      var cls = a.status === 'failed' ? 'bad' : a.status === 'suppressed' ? 'off' : a.kind === 'alert' ? 'warn' : 'muted';
      return '<div class="al"><span class="' + cls + '">' + esc(a.kind) + ' · ' + esc(a.status) + '</span> <span class="muted">' + esc((a.ts || '').slice(5, 16).replace('T', ' ')) + '</span><br>' + esc((a.message || '').slice(0, 280)) + '</div>';
    }).join('');
  }

  function renderErrors(s) {
    var es = s.errors || [];
    if (!es.length) { $('errors').innerHTML = '<div class="empty">no errors</div>'; return; }
    $('errors').innerHTML = es.map(function (e) {
      return '<div class="err"><span class="w">' + esc(e.where_) + '</span> <span class="muted">' + hhmm(e.ts) + ' ' + esc((e.ts || '').slice(0, 10)) + '</span><div class="m">' + esc(e.message) + '</div></div>';
    }).join('');
  }
})();
</script>
</body>
</html>
