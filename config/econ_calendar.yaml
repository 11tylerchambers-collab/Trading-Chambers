# High-impact US economic events used by the Phase 1A news-day filter (PHASE1A_SPEC.md §5.4).
# Edit freely: one entry per event; a date with any entry is a "news day".
# Times are US/Eastern release times.
# Sources:
#   FOMC: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm  (retrieved 2026-09-27; page last updated 2026-09-16)
#   CPI: https://www.bls.gov/schedule/news_release/cpi.htm  (retrieved 2026-09-27; cross-checked vs https://www.bls.gov/schedule/2026/home.htm)
#   Employment Situation: https://www.bls.gov/schedule/news_release/empsit.htm  (retrieved 2026-09-27; cross-checked vs https://www.bls.gov/schedule/2026/home.htm)
#   PCE / GDP: https://www.bea.gov/news/schedule  (retrieved 2026-09-27; cross-checked vs https://apps.bea.gov/API/signup/release_dates.json and the BEA ICS feed)
# Caveats:
#   - The Fed lists 2027 meetings as tentative until confirmed at the preceding meeting.
#   - As of 2026-09-27, BLS had not published its 2027 schedule (bls.gov/schedule/2027/home.htm returns 404),
#     and BEA had not published 2027 dates (its "Next Year" tab is empty). All 2027 BLS/BEA entries are
#     estimates (confirmed: false). 2027 falls on the same weekdays as 2021, so the estimates follow BLS/BEA
#     2021 release patterns. Replace them once the agencies publish their 2027 schedules.
#   - The 2025 federal shutdown shifted some late-2025/early-2026 dates. The 2026 dates below come from the
#     current (post-revision) official schedules. A new shutdown or lapse in appropriations could move them again.
